name: foodtruckz
description: Displays foodtrucks in Nuremberg for the current user location
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  # modules
  core:
    path: modules/libraries/core
  foodtruck_overview:
    path: modules/features/foodtruck_overview
  foodtruck_details:
    path: modules/features/foodtruck_details


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true