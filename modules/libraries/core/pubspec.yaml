name: core
description: Contains all dependencies and shared code

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.7

  # logging
  fimber: ^0.7.0

  # data flow
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # data classes
  equatable: ^3.0.0
  json_annotation: ^4.12.0

  # network
  dio: ^5.11.1
  retrofit: ^4.10.0

  # location
  location: ^10.2.0

  # collection
  collection: ^1.19.1

  # localization
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  json_serializable: ^6.15.2
  analyzer: ^14.7.0
  build_verify: ^3.1.1
  retrofit_generator: ^10.3.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true